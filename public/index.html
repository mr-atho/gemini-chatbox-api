<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#004da5" />
  <title>Hopeline Care Chatbot | Sahabat Hoca</title>
  
  <!-- Nunito Sans Font matching Hopeline Care -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="brand-info">
          <div class="brand-avatar">
            <svg class="hoca-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#fed500"/>
              <path d="M7 12h3l1.5-3 2 6 1.5-3h2" stroke="#004da5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="status-indicator" title="Online & Siap Mendengarkan"></span>
          </div>
          <div>
            <h1 class="brand-title">Hopeline Care</h1>
            <p class="brand-subtitle">Sahabat Hoca • Siap Mendengarkan & Mendoakan</p>
          </div>
        </div>

        <a href="https://hopeline.care" target="_blank" rel="noopener noreferrer" class="header-link" title="Kunjungi Website Utama Hopeline Care">
          <span>hopeline.care</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </a>
      </div>
    </header>

    <!-- Main Container -->
    <main class="chat-container">
      <!-- Chat Box -->
      <div id="chat-box" class="chat-box" role="log" aria-live="polite"></div>

      <!-- Quick Suggestion Chips -->
      <div class="suggestion-chips" id="suggestion-chips">
        <button type="button" class="chip" data-prompt="Halo Hoca, saya sedang merasa cemas dan butuh teman cerita.">
          🌿 Saya merasa cemas
        </button>
        <button type="button" class="chip" data-prompt="Bagaimana cara mengajukan permohonan doa di Hopeline Care?">
          🙏 Permohonan Doa
        </button>
        <button type="button" class="chip" data-prompt="Saya ingin curhat lebih lanjut dengan sahabat pendengar di Ruang Cerita.">
          💬 Ruang Curhat Hub
        </button>
        <button type="button" class="chip" data-prompt="Bisa jelaskan layanan apa saja yang ada di Hopeline Care?">
          💙 Tentang Hopeline Care
        </button>
      </div>

      <!-- Chat Form -->
      <form id="chat-form" class="chat-input-bar">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Ceritakan apa yang sedang kamu rasakan..." 
          autocomplete="off" 
          required 
          aria-label="Pesan untuk Hoca"
        />
        <button type="submit" id="send-button" aria-label="Kirim pesan">
          <span>Kirim</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>

      <!-- Disclaimer Footer -->
      <footer class="app-disclaimer">
        <p>Hoca adalah asisten pendamping berbasis AI • Jika kamu dalam krisis darurat atau bahaya, segera hubungi layanan <strong>112 / 119</strong>.</p>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
